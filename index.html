<style>
html,body{margin:0;background:#0b1530;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
#lock{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:linear-gradient(160deg,#0b1530,#1e3a8a)}
.lk{background:#fff;border-radius:16px;padding:26px 24px;width:min(360px,100%);box-shadow:0 20px 60px #0006;text-align:center}
.lk img{width:72px;height:72px;border-radius:16px}
.lk h1{font-size:1.3rem;margin:10px 0 4px;color:#0b1530}.lk p{color:#667085;font-size:.9rem;margin:0 0 16px}
.lk input[type=password],.lk input[type=text]{width:100%;box-sizing:border-box;font:600 1.05rem ui-monospace,Menlo,monospace;letter-spacing:.08em;text-align:center;padding:11px;border:1px solid #cfd5e3;border-radius:10px;text-transform:uppercase}
.lk button{width:100%;margin-top:12px;background:#2563eb;color:#fff;border:0;border-radius:10px;padding:12px;font:600 1rem Inter,sans-serif;cursor:pointer}
.lk button:disabled{opacity:.6}
.lk label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;font-size:.88rem;color:#344054}
.lk .err{color:#dc2626;font-size:.88rem;min-height:1.2em;margin-top:8px}
</style>
</head>
<body>
<div id="lock"><form class="lk" id="lkf" autocomplete="off">
<img src="icon-192.png" alt="">
<h1>VBA Coach</h1>
<p>Entre ton code personnel pour ouvrir l'application.</p>
<input id="code" type="password" placeholder="XXXXX-XXXXX" autocapitalize="characters" spellcheck="false">
<label><input type="checkbox" id="rem" checked> Se souvenir de moi sur cet appareil</label>
<button id="go">Ouvrir</button>
<div class="err" id="err"></div>
</form></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(code) {
  const norm = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(BLOB.s), iterations: BLOB.it, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BLOB.i) }, key, b64(BLOB.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function launch(app) {
  const st = document.createElement('style'); st.textContent = app.css; document.head.appendChild(st);
  document.body.innerHTML = app.body;
  document.body.style.background = '';
  const sc = document.createElement('script'); sc.textContent = app.js; document.body.appendChild(sc);
}
async function tryCode(code, remember) {
  const app = await unlock(code);
  try { if (remember) localStorage.setItem('vbacoach.code', code); else localStorage.removeItem('vbacoach.code'); } catch (e) {}
  launch(app);
}
document.getElementById('lkf').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('go'), err = document.getElementById('err');
  b.disabled = true; b.textContent = 'Ouverture…'; err.textContent = '';
  try { await tryCode(document.getElementById('code').value, document.getElementById('rem').checked); }
  catch (e) { err.textContent = window.crypto && crypto.subtle ? 'Code incorrect.' : 'Ce navigateur ne permet pas le déchiffrement (ouvre l\'adresse en https).'; b.disabled = false; b.textContent = 'Ouvrir'; }
});
(async () => {
  let saved = null; try { saved = localStorage.getItem('vbacoach.code'); } catch (e) {}
  if (saved) { try { await tryCode(saved, true); return; } catch (e) { try { localStorage.removeItem('vbacoach.code'); } catch (x) {} } }
  document.getElementById('code').focus();
})();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
